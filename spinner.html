<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenLayer Portal Spinner</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f7f7f5;color:#111}
  main{min-height:100vh;display:grid;place-items:center;gap:48px;padding:48px}
  .row{display:flex;align-items:center;gap:42px;flex-wrap:wrap;justify-content:center}
  .sample{display:grid;place-items:center;width:180px;height:140px;border-radius:18px}
  .light{background:#fff;border:1px solid #ddd}
  .dark{background:#111;border:1px solid #2b2d31}
  .note{max-width:620px;text-align:center;opacity:.7;font-size:14px}
  code{background:rgba(0,0,0,.06);padding:2px 6px;border-radius:4px}

  /* ---- GenLayer Portal Spinner ---- */
  .gl-spinner {
    width: 56px;
    height: 56px;
    display: inline-block;
    animation: gl-spin 1.45s cubic-bezier(.55,.08,.35,.92) infinite;
    transform-origin: 50% 50%;
  }
  .gl-spinner img {
    width: 100%;
    height: 100%;
    display: block;
  }
  @keyframes gl-spin {
    to { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .gl-spinner { animation: none; }
  }
</style>
</head>
